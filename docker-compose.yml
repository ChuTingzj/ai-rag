services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: python:3.12-slim
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "pip install -q uv && uv sync && uv run uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000",
      ]
    volumes:
      - .:/app
      - ./data:/data
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
      CONNECTORS_SERVICE_URL: http://connectors:8082
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local_bge_m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      DATA_DIR: /data
      PYTHONPATH: /app/apps/api:/app/packages/rag
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: python:3.12-slim
    working_dir: /app
    command: ["sh", "-c", "pip install -q uv && uv sync && uv run arq app.workers.tasks.WorkerSettings"]
    volumes:
      - .:/app
      - ./data:/data
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
      CONNECTOR_ENCRYPTION_SECRET: ${CONNECTOR_ENCRYPTION_SECRET:-${JWT_SECRET:-dev-jwt-secret-change-me}}
      CONNECTORS_SERVICE_URL: http://connectors:8082
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local_bge_m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      DATA_DIR: /data
      PYTHONPATH: /app/apps/api:/app/packages/rag
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      connectors:
        condition: service_started

  auth:
    image: node:22-bookworm-slim
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "corepack enable && pnpm install --frozen-lockfile && pnpm exec turbo run build --filter=@ai-rag/auth && pnpm --filter @ai-rag/auth start:prod",
      ]
    volumes:
      - .:/app
    environment:
      AUTH_PORT: "8081"
      AUTH_DATABASE_URL: postgresql://rag:rag@postgres:5432/auth
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy

  connectors:
    image: node:22-bookworm-slim
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "corepack enable && pnpm install --frozen-lockfile && pnpm exec turbo run build --filter=@ai-rag/connectors && pnpm --filter @ai-rag/connectors start:prod",
      ]
    volumes:
      - .:/app
    environment:
      CONNECTORS_PORT: "8082"
      CONNECTORS_DATABASE_URL: postgresql://rag:rag@postgres:5432/connectors
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      CONNECTOR_ENCRYPTION_SECRET: ${CONNECTOR_ENCRYPTION_SECRET:-${JWT_SECRET:-dev-jwt-secret-change-me}}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
      RAG_API_URL: http://api:8000
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  gateway:
    image: node:22-bookworm-slim
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "corepack enable && pnpm install --frozen-lockfile && pnpm exec turbo run build --filter=@ai-rag/gateway && pnpm --filter @ai-rag/gateway start:prod",
      ]
    volumes:
      - .:/app
    environment:
      GATEWAY_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
      AUTH_SERVICE_URL: http://auth:8081
      CONNECTORS_SERVICE_URL: http://connectors:8082
      RAG_API_URL: http://api:8000
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - connectors
      - api

volumes:
  postgres_data:
  redis_data:
