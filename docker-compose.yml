services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    image: python:3.12-slim
    working_dir: /app
    command: ["sh", "-c", "pip install -q uv && uv sync && uv run arq app.workers.tasks.WorkerSettings"]
    volumes:
      - .:/app
      - ./data:/data
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local_bge_m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      DATA_DIR: /data
      PYTHONPATH: /app/apps/api:/app/packages/rag
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
