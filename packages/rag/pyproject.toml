[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
local-ml = ["sentence-transformers>=3.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["domain", "providers", "rag_lib"]
