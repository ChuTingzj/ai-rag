[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "jieba>=0.42.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.6.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "pgvector>=0.5.0",
    "sqlalchemy>=2.0.52",
]

[project.optional-dependencies]
# Intel macOS: torch wheels stop at 2.2.x; transformers 5+ needs torch>=2.5, so pin ST 3.x there.
# torch 2.2.x is built against NumPy 1.x ABI.
local-ml = [
    "sentence-transformers>=3.4.0,<4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sentence-transformers>=3.4.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "acl",
    "connectors",
    "db",
    "domain",
    "eval",
    "generate",
    "ingest",
    "orchestrator",
    "providers",
    "rag",
    "rag_lib",
    "retrieve",
]
